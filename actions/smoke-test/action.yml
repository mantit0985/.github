name: 'Smoke Test'
description: 'Standardized health and observability probes for fleet containers'
inputs:
  image_name:
    description: 'Container image to test'
    required: true
  port:
    description: 'Port to expose'
    required: false
    default: '8080'
  env_vars:
    description: 'Environment variables passed as a space-separated list (e.g., "VAR1=val1 VAR2=val2")'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Set Smoke container name
      shell: bash
      run: |
        echo "SMOKE_CONTAINER_NAME=smoke-test-${{ github.repository }}-${{ github.run_id }}" >> $GITHUB_ENV

    - name: Clean stale container
      shell: bash
      run: |
        docker rm -f $SMOKE_CONTAINER_NAME 2>/dev/null || true

    - name: Run Container
      shell: bash
      run: |
        docker run -d --name $SMOKE_CONTAINER_NAME -p ${{ inputs.port }}:${{ inputs.port }} ${{ inputs.env_vars }} ${{ inputs.image_name }}

    - name: Probe Endpoints
      shell: bash
      run: |
        SMOKETEST_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $SMOKE_CONTAINER_NAME)

        echo "Probing endpoints at http://${SMOKETEST_IP}:${{ inputs.port }}"

        for i in $(seq 1 30); do
          if curl -sf "http://${SMOKETEST_IP}:${{ inputs.port }}/healthz" > /dev/null; then
            echo "Container became healthy after $i seconds"
            break
          fi
          docker logs $SMOKE_CONTAINER_NAME 2>&1 | tail -5
          sleep 1
        done

        curl -f "http://${SMOKETEST_IP}:${{ inputs.port }}/healthz"
        curl -f "http://${SMOKETEST_IP}:${{ inputs.port }}/readyz"
        curl -f "http://${SMOKETEST_IP}:${{ inputs.port }}/metrics"
        curl -f "http://${SMOKETEST_IP}:${{ inputs.port }}/version"

    - name: Cleanup
      shell: bash
      run: docker stop $SMOKE_CONTAINER_NAME && docker rm $SMOKE_CONTAINER_NAME
      if: always()

