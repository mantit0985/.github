# Build and push a Docker image to the project's container registry.
#
# Copy this file into a project repository as:
#   .github/workflows/build-push.yml
#
# Required repository configuration (Settings > Secrets and variables > Actions):
#
#   Variables tab:
#     SERVICE_DOMAIN       Base domain for the registry, e.g. "example.com".
#                          The login target becomes registry.example.com.
#
#   Secrets tab:
#     REGISTRY_USERNAME    Username for registry.<SERVICE_DOMAIN>
#     REGISTRY_PASSWORD    Password or access token for registry.<SERVICE_DOMAIN>
#
# Behaviour:
#   - Builds the image on every push to main and on all pull requests.
#   - Tags the image as registry.<SERVICE_DOMAIN>/<image_name>:latest and
#     :sha-<short-sha> (full SHA and other tag formats: see the metadata step).
#   - Pushes ONLY on pushes to main. Pull requests build the image as a
#     validation step but never push it.

name: build-push

on:
  push:
    branches:
      - main
  pull_request:

env:
  # Registry host, derived from the SERVICE_DOMAIN repository variable.
  # Do not edit unless the "registry." prefix scheme changes fleet-wide.
  REGISTRY: registry.${{ vars.SERVICE_DOMAIN }}

  # Customize: the image path used after the registry host.
  # Default mirrors the GitHub repository ("owner/repo"), which is a safe
  # baseline. Replace it with a fixed name when the registry path differs:
  #   IMAGE_NAME: my-service          ->  registry.example.com/my-service
  #   IMAGE_NAME: team/my-service     ->  registry.example.com/team/my-service
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Verify required registry configuration
        env:
          SERVICE_DOMAIN: ${{ vars.SERVICE_DOMAIN }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          missing=()
          [ -z "${SERVICE_DOMAIN}" ] && missing+=('SERVICE_DOMAIN (repository variable)')
          [ -z "${REGISTRY_USERNAME}" ] && missing+=('REGISTRY_USERNAME (repository secret)')
          [ -z "${REGISTRY_PASSWORD}" ] && missing+=('REGISTRY_PASSWORD (repository secret)')
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required configuration: ${missing[*]}"
            echo "Set these under Settings > Secrets and variables > Actions (Variables and Secrets tabs)."
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # :latest on pushes to the default branch only; never computed on PRs
            type=raw,value=latest,enable={{is_default_branch}}
            # :sha-<short sha> on every build, e.g. sha-9c2f1ab.
            # For the bare full SHA instead, use: type=sha,format=long,prefix=
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          # Customize: the build context passed to the daemon. Use the
          # repository root ('.'), a subdirectory ('services/api'), or a
          # sibling path when this workflow lives in the repo root.
          context: .

          # Customize: path to the Dockerfile, relative to the checkout,
          # e.g. ./docker/Dockerfile or ./services/api/Dockerfile.
          file: ./Dockerfile

          # Push only when running from a push event to main; pull requests
          # build (validate) the image without publishing it.
          push: ${{ github.event_name == 'push' }}

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          # Reuse registry-independent layer cache across runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max