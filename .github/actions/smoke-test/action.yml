name: 'Smoke Test'
description: 'Standardized health and observability probes for template repository containers'
inputs:
  image_name:
    description: 'Container image to test'
    required: true
  port:
    description: 'Port to expose'
    required: false
    default: '8080'
  env_vars:
    description: 'Environment variables passed as a space-separated list (e.g., "VAR1=val1 VAR2=val2")'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Set Smoke container name
      shell: bash
      run: |
        SMOKE_CONTAINER_NAME="smoke-$(printf '%s' "${{ inputs.image_name }}" | tr '/:' '--')-$$"
        echo "SMOKE_CONTAINER_NAME=$SMOKE_CONTAINER_NAME" >> "$GITHUB_ENV"

    - name: Run Container
      shell: bash
      run: |
        docker rm -f "$SMOKE_CONTAINER_NAME" >/dev/null 2>&1 || true
        docker run -d --name "$SMOKE_CONTAINER_NAME" -p 127.0.0.1::${{ inputs.port }} ${{ inputs.env_vars }} ${{ inputs.image_name }}

    - name: Probe Endpoints
      shell: bash
      run: |
        # Probes share the smoke container's network namespace so the check is
        # independent of bridge/overlay topology: a swarm-task runner cannot
        # reach a default-bridge IP (DOCKER-ISOLATION), and bridge IPs of
        # persistent runners are not stable either. curlimages/curl image is
        # pinned because the app image itself may lack curl/wget.
        PROBE="curlimages/curl:8.23.0"

        echo "Probing endpoints in-container (netns-shared) on port ${{ inputs.port }}"

        for i in $(seq 1 30); do
          if docker run --rm --network "container:$SMOKE_CONTAINER_NAME" "$PROBE" -sf --max-time 3 "http://127.0.0.1:${{ inputs.port }}/healthz" > /dev/null; then
            echo "Container became healthy after $i seconds"
            break
          fi
          docker logs "$SMOKE_CONTAINER_NAME" 2>&1 | tail -5
          sleep 1
        done

        docker run --rm --network "container:$SMOKE_CONTAINER_NAME" "$PROBE" -f -m 5 "http://127.0.0.1:${{ inputs.port }}/healthz"
        docker run --rm --network "container:$SMOKE_CONTAINER_NAME" "$PROBE" -f -m 5 "http://127.0.0.1:${{ inputs.port }}/readyz"
        docker run --rm --network "container:$SMOKE_CONTAINER_NAME" "$PROBE" -f -m 5 "http://127.0.0.1:${{ inputs.port }}/metrics"
        docker run --rm --network "container:$SMOKE_CONTAINER_NAME" "$PROBE" -f -m 5 "http://127.0.0.1:${{ inputs.port }}/version"

    - name: Cleanup
      shell: bash
      run: |
        docker stop "$SMOKE_CONTAINER_NAME" >/dev/null 2>&1 || true
        docker rm -f "$SMOKE_CONTAINER_NAME" >/dev/null 2>&1 || true
      if: always()
