name: Publish Release
description: Publish a GitHub release for an existing tag.
inputs:
  tag:
    required: true
    type: string
  release_artifact_path:
    required: false
    type: string
  release_cmd:
    required: false
    type: string
  github_token:
    required: true
    type: string
  working-dir:
    required: false
    type: string
    default: .
permissions:
  contents: write
  actions: read
runs:
  using: composite
  steps:
  - name: Release actor gate
    uses: mantit0985/.github/.github/actions/release-actor-gate@main
  - name: Checkout tag
    uses: actions/checkout@v4
    with:
      ref: refs/tags/${{ inputs.tag }}
  - name: Verify tag name vs VERSION
    shell: bash
    run: 'TAG="${{ inputs.tag }}"

      VERSION_CONTENT=$(git show HEAD:VERSION 2>/dev/null || echo "")

      VERSION=$(echo "$VERSION_CONTENT" | tr -d ''[:space:]'')

      TAG_NUM=${TAG#v}

      VER_NUM=${VERSION#v}

      if [ "$TAG_NUM" != "$VER_NUM" ]; then echo "FAIL[1]: Tag $TAG not equal to VERSION
      $VERSION" >&2; exit 1; fi

      echo "PASS[1] Tag matches VERSION"

      '
  - name: Commit hygiene gate
    uses: mantit0985/.github/.github/actions/commit-hygiene-gate@main
    with:
      head: ${{ inputs.tag }}
  - name: Verify latest CI run succeeded
    env:
      GH_TOKEN: ${{ inputs.github_token }}
    shell: bash
    run: 'TAG_COMMIT=$(git rev-parse HEAD)

      REPO=$(git remote get-url --push origin | sed -E -e ''s|\.git/?$||'' -e ''s|.*github\.com[/:]([^/]+)/([^/]+)/?$|\1/\2|'')

      API_URL="https://api.github.com/repos/${REPO}/actions/runs?head_sha=${TAG_COMMIT}"

      HTTP_CODE=$(curl -s -o "${RUNNER_TEMP}/ci_runs.json" -w ''%{http_code}'' -H
      "Authorization: Bearer ${GH_TOKEN}" -H ''Accept: application/vnd.github+json''
      "${API_URL}")

      if [ "$HTTP_CODE" != "200" ]; then echo "FAIL[3]: CI run lookup failed (HTTP
      ${HTTP_CODE}) for commit ${TAG_COMMIT}" >&2; exit 1; fi

      CI_CONCLUSION=$(jq -r ''[.workflow_runs[] | select(.name | startswith("CI"))
      | .conclusion][0] // empty'' "${RUNNER_TEMP}/ci_runs.json")

      if [ -z "$CI_CONCLUSION" ]; then echo "FAIL[3]: No CI run found for commit $TAG_COMMIT"
      >&2; exit 1; fi

      if [ "$CI_CONCLUSION" != "success" ]; then echo "FAIL[3]: CI run concluded $CI_CONCLUSION"
      >&2; exit 1; fi

      echo "PASS[3] Latest CI run succeeded"

      '
  - name: Verify tag signature via API
    env:
      GH_TOKEN: ${{ inputs.github_token }}
    shell: bash
    run: 'TAG="${{ inputs.tag }}"

      REPO=$(git remote get-url --push origin | sed -E -e ''s|\.git/?$||'' -e ''s|.*github\.com[/:]([^/]+)/([^/]+)/?$|\1/\2|'')

      REF=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H ''Accept: application/vnd.github+json''
      "https://api.github.com/repos/${REPO}/git/ref/tags/${TAG}")

      OBJECT_SHA=$(echo "$REF" | jq -r ''.object.sha'')

      OBJECT_TYPE=$(echo "$REF" | jq -r ''.object.type'')

      if [ "$OBJECT_TYPE" != "tag" ]; then echo "FAIL[4]: Tag $TAG is not an annotated
      tag (type=${OBJECT_TYPE})" >&2; exit 1; fi

      TAGOBJ=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H ''Accept: application/vnd.github+json''
      "https://api.github.com/repos/${REPO}/git/tags/${OBJECT_SHA}")

      TAG_NAME=$(echo "$TAGOBJ" | jq -r ''.tag'')

      VERIFIED=$(echo "$TAGOBJ" | jq -r ''.verification.verified'')

      if [ "$TAG_NAME" != "$TAG" ] || [ "$VERIFIED" != "true" ]; then echo "FAIL[4]:
      Tag $TAG failed API signature verification (verified=${VERIFIED})" >&2; exit
      1; fi

      echo "PASS[4] Tag signature verified via GitHub API"

      '
  - name: Resolve repo slug
    shell: bash
    run: 'REPO=$(git remote get-url --push origin | sed -E -e ''s|\.git/?$||'' -e
      ''s|.*github\.com[/:]([^/]+)/([^/]+)/?$|\1/\2|'')

      echo "REPO=$REPO" >> "$GITHUB_ENV"

      '
  - name: Run release command if specified
    if: ${{ inputs.release_cmd != '' }}
    working-directory: ${{ inputs.working-dir }}
    run: ${{ inputs.release_cmd }}
  - name: Prepare artifacts
    shell: bash
    run: "TARGET_DIR=$(mktemp -d)\necho \"TARGET_DIR=$TARGET_DIR\" >> \"$GITHUB_ENV\"\
      \nif [ -n \"${{ inputs.release_artifact_path }}\" ]; then\n  shopt -s globstar\
      \ dotglob\n  cp -r ${{ inputs.release_artifact_path }} \"${TARGET_DIR}/\"\n\
      else\n  tar -czf \"${TARGET_DIR}/${GITHUB_REPOSITORY//\\//-}-${{ inputs.tag\
      \ }}-source.tar.gz\" --exclude=.git .\nfi\n(cd \"${TARGET_DIR}\" && find . -type\
      \ f -print0 | sort -z | xargs -0 sha256sum --) > \"$RUNNER_TEMP/SHA256SUMS\"\
      \necho \"Artifacts prepared in ${TARGET_DIR}\"\n"
  - name: Check for existing release
    shell: bash
    run: "STATUS=$(curl -s -o /dev/null -w '%{http_code}' -H \"Authorization: Bearer\
      \ ${{ inputs.github_token }}\" -H 'Accept: application/vnd.github+json' \"https://api.github.com/repos/${{\
      \ env.REPO }}/releases/tags/${{ inputs.tag }}\")\nif [ \"$STATUS\" = \"200\"\
      \ ]; then\n  echo \"RELEASE_EXISTS: Release ${{ inputs.tag }} already exists\"\
      \ >&2\n  exit 1\nfi\n"
  - name: Create release and upload assets
    shell: bash
    env:
      GH_TOKEN: ${{ inputs.github_token }}
    run: "TAG=\"${{ inputs.tag }}\"\nBODY=\"$(awk -v t=\"## ${TAG}\" '$0==t{f=1;next}\
      \ f&&/^## /{exit} f' CHANGELOG.md || true)\"\nif [ -z \"$BODY\" ]; then\n  echo\
      \ \"NO_CHANGELOG_SECTION: CHANGELOG.md must contain a '## ${TAG}' section at\
      \ the tagged commit (deliberate: no silent releases)\" >&2\n  exit 1\nfi\nRESP=$(curl\
      \ -sf -X POST -H \"Authorization: Bearer ${{ inputs.github_token }}\" -H 'Accept:\
      \ application/vnd.github+json' \"https://api.github.com/repos/${{ env.REPO }}/releases\"\
      \ -d \"$(jq -n --arg tag \"$TAG\" --arg body \"$BODY\" '{tag_name:$tag, name:$tag,\
      \ body:$body}')\")\nREL_ID=$(echo \"$RESP\" | jq -r '.id')\nif [ -z \"$REL_ID\"\
      \ ] || [ \"$REL_ID\" = \"null\" ]; then echo \"RELEASE_CREATE_FAILED: $(echo\
      \ \"$RESP\" | head -c 400)\" >&2; exit 1; fi\ncd \"$TARGET_DIR\"\nupload_asset()\
      \ {\n  local FILE=\"$1\" NAME\n  NAME=$(basename \"$FILE\")\n  ASSET_ID=$(curl\
      \ -sf -H \"Authorization: Bearer ${{ inputs.github_token }}\" -H 'Accept: application/vnd.github+json'\
      \ \"https://api.github.com/repos/${{ env.REPO }}/releases/${REL_ID}/assets\"\
      \ | jq -r --arg n \"$NAME\" '[.[] | select(.name==$n)][0].id // empty')\n  if\
      \ [ -n \"$ASSET_ID\" ]; then\n    curl -sf -X DELETE -H \"Authorization: Bearer\
      \ ${{ inputs.github_token }}\" -H 'Accept: application/vnd.github+json' \"https://api.github.com/repos/${{\
      \ env.REPO }}/assets/${ASSET_ID}\"\n  fi\n  curl -sf -X POST -H \"Authorization:\
      \ Bearer ${{ inputs.github_token }}\" -H 'Accept: application/vnd.github+json'\
      \ -H 'Content-Type: application/octet-stream' --data-binary \"@${FILE}\" \"\
      https://uploads.github.com/repos/${{ env.REPO }}/releases/${REL_ID}/assets?name=${NAME}\"\
      \n}\nfind . -type f | sed 's|^./||' | while read -r f; do upload_asset \"$TARGET_DIR/$f\"\
      ; done\nupload_asset \"$RUNNER_TEMP/SHA256SUMS\"\n"
