name: 'Container Deploy'
description: 'Standardized build and push of container variants to GHCR'
inputs:
  image_name:
    description: 'Base name of the image'
    required: true
  tag:
    description: 'Version tag'
    required: true
  target:
    description: 'Build target (e.g., runtime-slim, runtime-alpine, runtime-distroless)'
    required: true
  registry_token:
    description: 'GHCR token passed from workflow'
    required: false
    default: ''
  build_args:
    description: 'Build arguments passed to docker build'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.registry_token }}
    
    - name: Build and Push
      uses: docker/build-push-action@v5
      with:
        context: .
        target: ${{ inputs.target }}
        push: true
        tags: |
          ghcr.io/${{ inputs.image_name }}:${{ inputs.target }}
          ghcr.io/${{ inputs.image_name }}:latest-${{ inputs.target }}
          ghcr.io/${{ inputs.image_name }}:${{ inputs.tag }}-${{ inputs.target }}
        build-args: ${{ inputs.build_args }}
        platforms: linux/amd64,linux/arm64
