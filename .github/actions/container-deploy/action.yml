name: 'Container Deploy'
description: 'Standardized build and push of container variants to GHCR'
inputs:
  image_name:
    description: 'Base name of the image'
    required: true
  tag:
    description: 'Version tag'
    required: true
  target:
    description: 'Build target (e.g., runtime-slim, runtime-alpine, runtime-distroless)'
    required: true
  registry_token:
    description: 'GHCR token passed from workflow'
    required: false
    default: ''
  build_args:
    description: 'Build arguments passed to docker build'
    required: false
    default: ''
  context:
    description: 'Build context directory relative to the workspace'
    required: false
    default: '.'
runs:
  using: "composite"
  steps:
    - name: Ensure persistent buildx builder
      shell: bash
      run: |
        docker buildx inspect hub-multiarch >/dev/null 2>&1 || \
          docker buildx create --name hub-multiarch --driver docker-container --bootstrap
        docker buildx use hub-multiarch
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.registry_token }}
    - name: Build and Push
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.context }}
        target: ${{ inputs.target }}
        push: true
        tags: |
          ghcr.io/${{ inputs.image_name }}:${{ inputs.target }}
          ghcr.io/${{ inputs.image_name }}:latest-${{ inputs.target }}
          ghcr.io/${{ inputs.image_name }}:${{ inputs.tag }}-${{ inputs.target }}
        build-args: ${{ inputs.build_args }}
        platforms: linux/amd64,linux/arm64
        # cache lives inside the persistent hub-multiarch builder container on
        # each node — no per-run gha cache upload/download over the uplink
