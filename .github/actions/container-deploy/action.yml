name: 'Container Deploy'
description: 'Standardized build and push of container variants to GHCR'
inputs:
  image_name:
    description: 'Base name of the image'
    required: true
  tag:
    description: 'Version tag'
    required: true
  target:
    description: 'Build target (e.g., runtime-slim, runtime-alpine, runtime-distroless)'
    required: true
  registry_token:
    description: 'GHCR token passed from workflow'
    required: false
    default: ''
  build_args:
    description: 'Build arguments passed to docker build'
    required: false
    default: ''
  context:
    description: 'Build context directory relative to the workspace'
    required: false
    default: '.'
runs:
  using: "composite"
  steps:
    # runner images may lack the buildx plugin, so a raw `docker buildx
    # create` fails with exit 125; the pinned action bootstraps its own
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.registry_token }}
    # Arch policy: the amd64 leg is the REQUIRED release-critical path; the
    # emulated arm64 leg is an external courtesy artifact and is ISOLATED so
    # QEMU flakiness can never block or fail a release publish. The courtesy
    # leg runs first; the required amd64 leg runs last and owns the contract
    # tags (last writer wins, with the legs serialized inside this composite).
    - name: Build and Push (arm64 courtesy)
      run: |
        for attempt in {1..5}; do
          if [ -n "${{ inputs.build_args }}" ]; then
            docker buildx build --platform linux/arm64 \
              ${{ inputs.build_args }} \
              --push \
              --tag ghcr.io/${{ inputs.image_name }}:${{ inputs.target }} \
              --tag ghcr.io/${{ inputs.image_name }}:latest-${{ inputs.target }} \
              --tag ghcr.io/${{ inputs.image_name }}:${{ inputs.tag }}-${{ inputs.target }} \
              ${{ inputs.context }}
          else
            docker buildx build --platform linux/arm64 \
              --push \
              --tag ghcr.io/${{ inputs.image_name }}:${{ inputs.target }} \
              --tag ghcr.io/${{ inputs.image_name }}:latest-${{ inputs.target }} \
              --tag ghcr.io/${{ inputs.image_name }}:${{ inputs.tag }}-${{ inputs.target }} \
              ${{ inputs.context }}
          fi
          rc=$?
          if [ $rc -eq 0 ]; then break; fi
          if [ $attempt -eq 5 ]; then exit $rc; fi
          sleep 30
        done
      continue-on-error: true

    - name: Build and Push
      run: |
        for attempt in {1..5}; do
          if [ -n "${{ inputs.build_args }}" ]; then
            docker buildx build --platform linux/amd64 \
              ${{ inputs.build_args }} \
              --push \
              --tag ghcr.io/${{ inputs.image_name }}:${{ inputs.target }} \
              --tag ghcr.io/${{ inputs.image_name }}:latest-${{ inputs.target }} \
              --tag ghcr.io/${{ inputs.image_name }}:${{ inputs.tag }}-${{ inputs.target }} \
              ${{ inputs.context }}
          else
            docker buildx build --platform linux/amd64 \
              --push \
              --tag ghcr.io/${{ inputs.image_name }}:${{ inputs.target }} \
              --tag ghcr.io/${{ inputs.image_name }}:latest-${{ inputs.target }} \
              --tag ghcr.io/${{ inputs.image_name }}:${{ inputs.tag }}-${{ inputs.target }} \
              ${{ inputs.context }}
          fi
          rc=$?
          if [ $rc -eq 0 ]; then break; fi
          if [ $attempt -eq 5 ]; then exit $rc; fi
          sleep 30
        done
