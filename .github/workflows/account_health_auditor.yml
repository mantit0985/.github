name: Account Health Auditor

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch: # Allow manual trigger
  workflow_call: # Allow this workflow to be called from other repositories
    inputs:
      owner:
        description: 'GitHub owner to audit'
        required: false
        type: string
    secrets:
      GH_PAT:
        required: true

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Health Audit
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python .github/scripts/audit_health.py ${{ inputs.owner && format('--owner {0}', inputs.owner) || '' }}

      - name: Commit and push report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add HEALTH_REPORT.md
          if git diff --staged --quiet; then
            echo "No changes to the health report."
          else
            git commit -m "docs: update Account Health Report [skip ci]"
            git push
          fi
