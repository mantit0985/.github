name: RQE Heartbeat

on:
  schedule:
    - cron: '0 0 * * *' # Daily
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Audit Health
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: python .github/scripts/audit_health.py

      - name: Update Dashboard
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: python .github/scripts/update_dashboard.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add HEALTH_REPORT.md DASHBOARD.md
          git commit -m "chore: update visibility layer [heartbeat]" || echo "No changes to commit"
          git push
