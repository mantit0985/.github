name: CD

on:
  push:
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-gate:
    name: CI Quality Gate
    runs-on: self-hosted
    permissions:
      actions: read
    steps:
      - name: Block until CI passes for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA='${{ github.sha }}'
          API='https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha="${SHA}"

          latest_ci() {
            curl -sf \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "${API}" | jq -c '[.workflow_runs[]? | select(.name == "CI")][0] // null'
          }

          # Wait (grace period) for a CI run for this exact commit to appear.
          # The primary flow is a tag push, which triggers CI and CD together.
          attempt=0
          while :; do
            RUN=$(latest_ci || echo null)
            if [ "${RUN}" != 'null' ]; then
              break
            fi
            attempt=$((attempt + 1))
            if [ "${attempt}" -gt 10 ]; then
              echo "::error::No CI run exists for commit ${SHA}; CD is blocked (CI must pass before CD)."
              exit 1
            fi
            echo "Waiting for CI run on commit ${SHA} (attempt ${attempt}/10)..."
            sleep 15
          done

          # Wait for that CI run to complete.
          attempt=0
          while :; do
            RUN=$(latest_ci || echo null)
            STATUS=$(printf '%s' "${RUN}" | jq -r '.status')
            CONCLUSION=$(printf '%s' "${RUN}" | jq -r '.conclusion // empty')
            RUN_ID=$(printf '%s' "${RUN}" | jq -r '.id // "unknown"')
            echo "CI run ${RUN_ID}: status=${STATUS} conclusion=${CONCLUSION}"
            if [ "${STATUS}" = 'completed' ]; then
              if [ "${CONCLUSION}" = 'success' ]; then
                echo "CI quality gate passed for commit ${SHA}."
                exit 0
              fi
              echo "::error::CI concluded with '${CONCLUSION}' for commit ${SHA}; CD is blocked."
              exit 1
            fi
            attempt=$((attempt + 1))
            if [ "${attempt}" -gt 40 ]; then
              echo "::error::Timed out waiting for CI on commit ${SHA}; CD is blocked."
              exit 1
            fi
            sleep 30
          done

  build-and-push:
    name: Build and Push Images
    runs-on: self-hosted
    needs: ci-gate
    env:
      DOCKER_BUILDKIT: 1
    strategy:
      matrix:
        target: [runtime-slim, runtime-alpine, runtime-distroless]
    permissions:
      contents: read
      packages: write
    secrets: inherit
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: latest

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ matrix.target }}
            ghcr.io/${{ github.repository }}:latest-${{ matrix.target }}
          target: ${{ matrix.target }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
