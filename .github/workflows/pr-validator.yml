name: 'PR Validator'

on:
  pull_request:
    types: [opened, edited, synchronize]
  workflow_dispatch:

concurrency:
  group: pr-validation-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  pull-requests: read
  contents: read
  checks: read

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Branch Name
        # Dependabot branches cannot follow the human naming convention
        if: github.actor != 'dependabot[bot]'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          echo "Checking branch name: $BRANCH_NAME"
          if [[ ! "$BRANCH_NAME" =~ ^(feat/|fix/|chore/|docs/|refactor/|test/|gh-dev-loop/).* ]]; then
            echo "Error: Branch name '$BRANCH_NAME' does not follow the naming convention (feat/, fix/, chore/, docs/, refactor/, test/, gh-dev-loop/)."
            exit 1
          fi

      - name: Check for Linked Issue
        # Dependabot PR bodies are auto-generated and never carry issue links
        if: github.actor != 'dependabot[bot]'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "Checking PR body for linked issue..."
          if [[ ! "$PR_BODY" =~ (Closes|Fixes|Resolves)\ #[0-9]+ ]]; then
            echo "Error: PR body must contain a linked issue (e.g., 'Closes #123')."
            exit 1
          fi

      - name: Template Validation
        # Dependabot PRs cannot be edited to fill the required template
        if: github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Validating PR template..."
          BODY=$(gh pr view "$PR_NUMBER" --json body -q '.body')

          if [[ ! "$BODY" =~ "# Purpose" ]] || [[ ! "$BODY" =~ "## Changes" ]]; then
            echo "Error: PR body is missing required sections (# Purpose or ## Changes)."
            exit 1
          fi

          if echo "$BODY" | grep -q '\[ \]'; then
            echo "Error: PR body contains incomplete checklist items ([ ]). Please mark all as completed ([x])."
            exit 1
          fi
          echo "Template validation passed."

      - name: Governance Enforcement
        if: github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Checking for emojis in title and body..."
          TITLE_BODY=$(gh pr view "$PR_NUMBER" --json title,body -q '.title + " " + .body')
          if echo "$TITLE_BODY" | grep -P '[\x{1F300}-\x{1F9FF}\x{2600}-\x{26FF}\x{2700}-\x{27BF}]' > /dev/null; then
            echo "Error: PR title or body contains emojis, which are prohibited by governance standards."
            exit 1
          fi
          echo "Governance enforcement passed."

      - name: Commit Linting
        if: github.actor != 'dependabot[bot]'
        run: |
          echo "Linting commit messages..."
          COMMITS=$(git log origin/main...HEAD --oneline)
          while read -r line; do
            if [[ -n "$line" ]] && [[ ! "$line" =~ ^[a-f0-9]+[[:space:]](feat|fix|chore|docs|refactor|test|perf|style)(\(.+\))?!?:[[:space:]].+ ]]; then
              echo "Error: Commit message does not follow Conventional Commits format: $line"
              exit 1
            fi
          done <<< "$COMMITS"
          echo "Commit linting passed."

      - name: PR Size Guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Checking PR size..."
          SIZE=$(gh pr view "$PR_NUMBER" --json additions,deletions -q '.additions + .deletions')
          if [ "$SIZE" -gt 500 ]; then
            echo "Warning: PR size is large ($SIZE lines changed). Consider splitting into smaller PRs."
          else
            echo "PR size is within acceptable limits ($SIZE lines)."
          fi

      - name: Check CI Status
        # Dependabot PRs trigger no template CI, so security-scan checks never exist for them
        if: github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Checking CI status..."
          OUT=$(gh pr checks "$PR_NUMBER" --json bucket,workflow)

          if echo "$OUT" | jq -e 'any(.[]; .workflow != "PR Validator" and (.bucket == "fail" or .bucket == "cancel"))' > /dev/null; then
            echo "Error: a required CI check has failed or been cancelled on this PR."
            echo "$OUT" | jq -r '.[] | select(.workflow != "PR Validator") | "  \(.workflow): \(.bucket)"'
            exit 1
          fi

          SEC_CHECKS=$(echo "$OUT" | jq -r '.[] | select(.workflow | test("Security|Scan"; "i")) | .bucket')
          if [[ -z "$SEC_CHECKS" ]]; then
            echo "Error: No security or scan checks were found for this PR. Security scans are mandatory."
            exit 1
          elif echo "$SEC_CHECKS" | grep -q 'fail\|cancel'; then
            echo "Error: One or more security scans failed or were cancelled."
            exit 1
          fi
          echo "CI and Security checks passed."
