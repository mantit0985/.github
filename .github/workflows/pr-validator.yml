name: 'PR Validator'

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read
  contents: read
  checks: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Branch Name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          echo "Checking branch name: $BRANCH_NAME"
          if [[ ! "$BRANCH_NAME" =~ ^(feat/|fix/|chore/|docs/|refactor/|test/|gh-dev-loop/).* ]]; then
            echo "Error: Branch name '$BRANCH_NAME' does not follow the naming convention (feat/, fix/, chore/, docs/, refactor/, test/, gh-dev-loop/)."
            exit 1
          fi

      - name: Check for Linked Issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "Checking PR body for linked issue..."
          if [[ ! "$PR_BODY" =~ (Closes|Fixes|Resolves)\ #[0-9]+ ]]; then
            echo "Error: PR body must contain a linked issue (e.g., 'Closes #123')."
            exit 1
          fi

      - name: Check CI Status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 'gh pr checks' reports one bucket per check: pass, fail, pending,
          # skipping, or cancel. Fail only if any required check has failed or
          # been cancelled. Pending checks are allowed because this workflow
          # runs in parallel with them.
          OUT=$(gh pr checks "$PR_NUMBER" --json bucket,workflow)
          echo "$OUT" | jq '.'

          if echo "$OUT" | jq -e 'any(.[]; .workflow != "PR Validator" and (.bucket == "fail" or .bucket == "cancel"))' > /dev/null; then
            echo "Error: a required CI check has failed or been cancelled on this PR."
            echo "$OUT" | jq -r '.[] | select(.workflow != "PR Validator") | "  \(.workflow): \(.bucket)"'
            exit 1
          fi
          echo "No failed or cancelled CI checks."
