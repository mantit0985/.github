name: 'PR Validator'

on:
  pull_request:
    types: [opened, edited, synchronize]
  workflow_dispatch:

concurrency:
  group: pr-validation-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  pull-requests: read
  contents: read
  checks: read

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Branch Name
        # Bot-authored PRs are exempt: author check is rerun-stable (github.actor
        # changes to the human who re-runs, but pull_request.user.login does not)
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          echo "Checking branch name: $BRANCH_NAME (author: $PR_AUTHOR)"
          if [ "$PR_AUTHOR" = "dependabot[bot]" ] || [ "$PR_AUTHOR" = "github-actions[bot]" ]; then
            echo "Bot PR — branch naming convention not enforced"
            exit 0
          fi
          if [[ ! "$BRANCH_NAME" =~ ^(feat/|fix/|chore/|docs/|refactor/|test/|gh-dev-loop/).* ]]; then
            echo "Error: Branch name '$BRANCH_NAME' does not follow the naming convention (feat/, fix/, chore/, docs/, refactor/, test/, gh-dev-loop/)."
            exit 1
          fi

      - name: Check for Linked Issue
        # Dependabot PR bodies are auto-generated and never carry issue links
        if: github.actor != 'dependabot[bot]'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "Checking PR body for linked issue..."
          if [[ ! "$PR_BODY" =~ (Closes|Fixes|Resolves)\ #[0-9]+ ]]; then
            echo "Error: PR body must contain a linked issue (e.g., 'Closes #123')."
            exit 1
          fi

      - name: Template Validation
        # Dependabot PRs cannot be edited to fill the required template; bot-authored PRs are exempt
        if: github.actor != 'dependabot[bot]' && github.actor != 'github-actions[bot]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Validating PR template..."
          BODY=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" | jq -r '.body // ""')

          if [[ ! "$BODY" =~ "# Purpose" ]] && [[ ! "$BODY" =~ "## Changes" ]]; then
            echo "Error: PR body is missing required sections (# Purpose or ## Changes)."
            exit 1
          fi

          if echo "$BODY" | grep -q '\[ \]'; then
            echo "Error: PR body contains incomplete checklist items ([ ]). Please mark all as completed ([x])."
            exit 1
          fi
          echo "Template validation passed."

      - name: Governance Enforcement
        if: github.actor != 'dependabot[bot]' && github.actor != 'github-actions[bot]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Checking for emojis in title and body..."
          TITLE_BODY=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" | jq -r '.title + " " + (.body // "")')
          if echo "$TITLE_BODY" | grep -P '[\x{1F300}-\x{1F9FF}\x{2600}-\x{26FF}\x{2700}-\x{27BF}]' > /dev/null; then
            echo "Error: PR title or body contains emojis, which are prohibited by governance standards."
            exit 1
          fi
          echo "Governance enforcement passed."

      - name: Commit Linting
        if: github.actor != 'dependabot[bot]'
        uses: ./.github/actions/commit-hygiene-gate
        with:
          base: 'origin/main'

      - name: PR Size Guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Checking PR size..."
          SIZE=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" | jq -r '(.additions // 0) + (.deletions // 0)')
          if [ "$SIZE" -gt 500 ]; then
            echo "Warning: PR size is large ($SIZE lines changed). Consider splitting into smaller PRs."
          else
            echo "PR size is within acceptable limits ($SIZE lines)."
          fi

      - name: Check CI Status
        if: github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Checking CI status..."
          HEAD_SHA=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" | jq -r '.head.sha')
          OUT=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100")

          FAILS=$(echo "$OUT" | jq '[.check_runs | map(select(.name != "validate")) | group_by(.name) | map(max_by(.started_at)) | map(select(.conclusion == "failure" or .conclusion == "cancelled")) | length]')
          if [ "$FAILS" -gt 0 ]; then
            echo "Error: $FAILS check(s) failed or were cancelled on this PR:"
            echo "$OUT" | jq -r '.check_runs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | "  \(.name): \(.conclusion)"'
            exit 1
          fi

          SEC=$(echo "$OUT" | jq '[.check_runs[] | select(.name | test("Security|Scan"; "i"))]')
          if [ "$(echo "$SEC" | jq 'length')" -gt 0 ]; then
            if echo "$SEC" | jq -e 'any(.[]; .conclusion == "failure" or .conclusion == "cancelled")' > /dev/null; then
              echo "Error: One or more security scans failed or were cancelled."
              exit 1
            fi
          else
            echo "Note: no security/scan checks exist for this commit; nothing to fail on."
          fi
          echo "CI and Security checks passed."