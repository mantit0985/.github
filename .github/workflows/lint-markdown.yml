name: Lint Markdown

on:
  push:
    paths:
      - '**/*.md'
  pull_request:
    paths:
      - '**/*.md'
  workflow_dispatch:
  workflow_call: # Allow this workflow to be called from other repositories

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Note: SHA-pinning this action is preferable long-term.
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0