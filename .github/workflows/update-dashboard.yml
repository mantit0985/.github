name: Account Dashboard Updater

on:
  schedule:
    - cron: '0 1 * * *' # Daily at 1 AM, after Auditor (midnight)
  workflow_dispatch: # Allow manual trigger
  workflow_call:

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/update_dashboard.py

      - name: Commit and push dashboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add DASHBOARD.md
          if git diff --staged --quiet; then
            echo "No changes to the dashboard."
          else
            git commit -m "docs: update Account Dashboard [skip ci]"
            git push
          fi
