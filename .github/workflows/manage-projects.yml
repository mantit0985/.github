name: Manage Projects

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Manage Project Board
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "⚠️ PROJECT_TOKEN not set. Skipping project board orchestration. Please add it to repository secrets to enable this feature."
            exit 0
          fi
          echo "Configuring Master Roadmap..."
          gh project create --owner mantit0985 --title "Master Roadmap" || echo "Board already exists"
