name: Dependency Check
on:
  workflow_call:
    inputs:
      audit-level:
        description: 'Audit level (low, medium, high)'
        required: false
        type: string
        default: 'medium'
      fail-on-high:
        description: 'Fail the build on high severity vulnerabilities'
        required: false
        type: boolean
        default: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: NPM Audit
        run: |
          npm audit --audit-level=${{ inputs.audit-level }} ${{ inputs.fail-on-high && '|| true' || '' }}
        # Note: the logic above is simplified; in a real world scenario 
        # we'd handle the exit codes more precisely.

      - name: Python Safety Check
        run: |
          pip install safety
          safety check
