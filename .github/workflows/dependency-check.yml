name: Dependency check

on:
  workflow_call:
    inputs:
      audit-level:
        description: 'npm audit level (low, moderate, high, critical)'
        required: false
        type: string
        default: 'moderate'
      fail-on-high:
        description: 'Fail the workflow if high or critical vulnerabilities are found'
        required: false
        type: boolean
        default: true
      python-safety:
        description: 'Run safety check for Python dependencies'
        required: false
        type: boolean
        default: false

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    concurrency:
      group: dependency-check-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ hashFiles('**/package-lock.json') != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: NPM audit
        id: npm_audit
        if: ${{ hashFiles('**/package-lock.json') != '' }}
        continue-on-error: true
        run: npm audit --audit-level=${{ inputs.audit-level }}

      - name: Fail on high vulnerabilities
        if: ${{ inputs.fail-on-high && steps.npm_audit.outcome == 'failure' }}
        run: npm audit --audit-level=high

      - name: Setup Python
        if: ${{ inputs.python-safety && hashFiles('**/requirements.txt') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Python safety check
        if: ${{ inputs.python-safety && hashFiles('**/requirements.txt') != '' }}
        continue-on-error: ${{ !inputs.fail-on-high }}
        run: |
          pip install safety
          safety check -r requirements.txt

      - name: Report result
        if: ${{ inputs.fail-on-high == false }}
        run: echo "Dependency audit completed. fail-on-high is false, so the workflow will not fail on findings."
