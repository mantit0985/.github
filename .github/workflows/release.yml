name: Release Trigger

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      release_cmd:
        required: false
        type: string
        default: ""
      release_artifact_path:
        required: false
        type: string
        default: ""
      working-dir:
        required: false
        type: string
        default: "."
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
      release_cmd:
        required: false
        type: string
        default: ""
      release_artifact_path:
        required: false
        type: string
        default: ""
      working-dir:
        required: false
        type: string
        default: "."

permissions:
  contents: write
  actions: read

jobs:
  gate-recheck:
    name: Release Gate Recheck
    runs-on: self-hosted
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Release actor gate
        uses: mantit0985/.github/.github/actions/release-actor-gate@main

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Verify tag name vs VERSION
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          VERSION_CONTENT=$(git show HEAD:VERSION 2>/dev/null || echo "")
          VERSION=$(echo "$VERSION_CONTENT" | tr -d '[:space:]')
          TAG_NUM=${TAG#v}
          VER_NUM=${VERSION#v}
          if [ "$TAG_NUM" != "$VER_NUM" ]; then
            echo "FAIL[1]: Tag $TAG not equal to VERSION $VERSION" >&2
            exit 1
          fi
          echo "PASS[1] Tag matches VERSION"

      - name: Verify tagged commit is main tip
        shell: bash
        run: |
          TAG_COMMIT=$(git rev-parse HEAD)
          REPO=$(git remote get-url --push origin | sed -E -e 's|\.git/?$||' -e 's|.*github\.com[/:]([^/]+)/([^/]+)/?$|\1/\2|')
          MAIN_COMMIT=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${REPO}/commits/main" | jq -r '.sha')
          if [ "$TAG_COMMIT" != "$MAIN_COMMIT" ]; then
            echo "FAIL[2]: Tag commit $TAG_COMMIT not equal to main tip $MAIN_COMMIT" >&2
            exit 1
          fi
          echo "PASS[2] Tagged commit is current main tip"

      - name: Commit hygiene gate
        uses: mantit0985/.github/.github/actions/commit-hygiene-gate@main
        with:
          head: ${{ inputs.tag }}

      - name: Verify latest CI run succeeded
        shell: bash
        run: |
          TAG_COMMIT=$(git rev-parse HEAD)
          REPO=$(git remote get-url --push origin | sed -E -e 's|\.git/?$||' -e 's|.*github\.com[/:]([^/]+)/([^/]+)/?$|\1/\2|')
          API_URL="https://api.github.com/repos/${REPO}/actions/runs?head_sha=${TAG_COMMIT}"
          HTTP_CODE=$(curl -s -o "${RUNNER_TEMP}/ci_runs.json" -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${API_URL}")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "FAIL[3]: CI run lookup failed (HTTP ${HTTP_CODE}) for commit ${TAG_COMMIT}" >&2
            exit 1
          fi
          CI_CONCLUSION=$(jq -r '[.workflow_runs[] | select(.name | startswith("CI")) | .conclusion][0] // empty' "${RUNNER_TEMP}/ci_runs.json")
          if [ -z "$CI_CONCLUSION" ]; then
            echo "FAIL[3]: No CI run found for commit $TAG_COMMIT" >&2
            exit 1
          fi
          if [ "$CI_CONCLUSION" != "success" ]; then
            echo "FAIL[3]: CI run concluded $CI_CONCLUSION" >&2
            exit 1
          fi
          echo "PASS[3] Latest CI run succeeded"

      - name: Verify CD run terminal state
        shell: bash
        run: |
          TAG_COMMIT=$(git rev-parse HEAD)
          REPO=$(git remote get-url --push origin | sed -E -e 's|\.git/?$||' -e 's|.*github\.com[/:]([^/]+)/([^/]+)/?$|\1/\2|')
          API_URL="https://api.github.com/repos/${REPO}/actions/runs?head_sha=${TAG_COMMIT}"
          HTTP_CODE=$(curl -s -o "${RUNNER_TEMP}/cd_runs.json" -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${API_URL}")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "FAIL[5]: CD run lookup failed (HTTP ${HTTP_CODE}) for commit ${TAG_COMMIT}" >&2
            exit 1
          fi
          CD_RUNS=$(jq -r '[.workflow_runs[] | select(.name | startswith("CD"))]' "${RUNNER_TEMP}/cd_runs.json")
          if [ "$(echo "$CD_RUNS" | jq 'length')" -eq 0 ]; then
            echo "FAIL[5]: no CD run for commit" >&2
            exit 1
          fi
          FIRST_CONCLUSION=$(echo "$CD_RUNS" | jq -r '.[0].conclusion // empty')
          FIRST_STATUS=$(echo "$CD_RUNS" | jq -r '.[0].status // empty')
          if [ -n "$FIRST_STATUS" ] && [ "$FIRST_STATUS" != "completed" ]; then
            echo "WAIT-marker CD not yet terminal; caller re-invocation re-evaluates" >&2
            exit 0
          fi
          if [ -z "$FIRST_CONCLUSION" ]; then
            echo "FAIL[5]: CD run status incomplete" >&2
            exit 1
          fi
          if [ "$FIRST_CONCLUSION" != "success" ] && [ "$FIRST_CONCLUSION" != "skipped" ]; then
            echo "FAIL[5]: CD run concluded $FIRST_CONCLUSION" >&2
            exit 1
          fi
          echo "PASS[5] CD run succeeded or completed-skip"

      - name: Verify tag signature via API
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          REPO=$(git remote get-url --push origin | sed -E -e 's|\.git/?$||' -e 's|.*github\.com[/:]([^/]+)/([^/]+)/?$|\1/\2|')
          REF=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${REPO}/git/ref/tags/${TAG}")
          OBJECT_SHA=$(echo "$REF" | jq -r '.object.sha')
          OBJECT_TYPE=$(echo "$REF" | jq -r '.object.type')
          if [ "$OBJECT_TYPE" != "tag" ]; then
            echo "FAIL[4]: Tag $TAG is not an annotated tag (type=${OBJECT_TYPE})" >&2
            exit 1
          fi
          TAGOBJ=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${REPO}/git/tags/${OBJECT_SHA}")
          TAG_NAME=$(echo "$TAGOBJ" | jq -r '.tag')
          VERIFIED=$(echo "$TAGOBJ" | jq -r '.verification.verified')
          REASON=$(echo "$TAGOBJ" | jq -r '.verification.reason')
          if [ "$TAG_NAME" != "$TAG" ] || [ "$VERIFIED" != "true" ] || [ "$REASON" != "valid" ]; then
            echo "FAIL[4]: Tag $TAG failed API signature verification (verified=${VERIFIED} reason=${REASON})" >&2
            exit 1
          fi
          echo "PASS[4] Tag signature verified via GitHub API"

  release:
    name: Publish Release
    needs: gate-recheck
    runs-on: self-hosted
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Release actor gate
        uses: mantit0985/.github/.github/actions/release-actor-gate@main

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Resolve repo slug
        shell: bash
        run: |
          REPO=$(git remote get-url --push origin | sed -E -e 's|\.git/?$||' -e 's|.*github\.com[/:]([^/]+)/([^/]+)/?$|\1/\2|')
          echo "REPO=$REPO" >> "$GITHUB_ENV"

      - name: Run release command if specified
        if: ${{ inputs.release_cmd != '' }}
        working-directory: ${{ inputs.working-dir }}
        run: ${{ inputs.release_cmd }}

      - name: Prepare artifacts
        shell: bash
        run: |
          TARGET_DIR=$(mktemp -d)
          echo "TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"
          if [ -n "${{ inputs.release_artifact_path }}" ]; then
            shopt -s globstar dotglob
            cp -r ${{ inputs.release_artifact_path }} "${TARGET_DIR}/"
          else
            tar -czf "${TARGET_DIR}/${GITHUB_REPOSITORY////$'-'}-${{ inputs.tag }}-source.tar.gz" --exclude=.git .
          fi
          # Generate SHA256SUMS
          (cd "${TARGET_DIR}" && find . -type f -print0 | sort -z | xargs -0 sha256sum --) > "$RUNNER_TEMP/SHA256SUMS"
          echo "Artifacts prepared in ${TARGET_DIR}"

      - name: Check for existing release
        shell: bash
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${REPO}/releases/tags/${{ inputs.tag }}")
          if [ "$STATUS" = "200" ]; then
            echo "RELEASE_EXISTS: Release ${{ inputs.tag }} already exists" >&2
            exit 1
          fi

      - name: Create release and upload assets
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          BODY="$(awk -v t="## ${TAG}" '$0==t{f=1;next} f&&/^## /{exit} f' CHANGELOG.md || true)"
          if [ -z "$BODY" ]; then
            echo "NO_CHANGELOG_SECTION: CHANGELOG.md must contain a '## ${TAG}' section at the tagged commit (deliberate: no silent releases)" >&2
            exit 1
          fi
          RESP=$(curl -sf -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${REPO}/releases" -d "$(jq -n --arg tag "$TAG" --arg body "$BODY" '{tag_name:$tag, name:$tag, body:$body}')")
          REL_ID=$(echo "$RESP" | jq -r '.id')
          if [ -z "$REL_ID" ] || [ "$REL_ID" = "null" ]; then echo "RELEASE_CREATE_FAILED: $(echo "$RESP" | head -c 400)" >&2; exit 1; fi
          cd "$TARGET_DIR"
          upload_asset() {
            local FILE="$1" NAME
            NAME=$(basename "$FILE")
            ASSET_ID=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${REPO}/releases/${REL_ID}/assets" | jq -r --arg n "$NAME" '[.[] | select(.name==$n)][0].id // empty')
            if [ -n "$ASSET_ID" ]; then
              curl -sf -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${REPO}/assets/${ASSET_ID}"
            fi
            curl -sf -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/octet-stream' --data-binary "@${FILE}" "https://uploads.github.com/repos/${REPO}/releases/${REL_ID}/assets?name=${NAME}"
          }
          find . -type f | sed 's|^./||' | while read -r f; do upload_asset "$TARGET_DIR/$f"; done
          upload_asset "$RUNNER_TEMP/SHA256SUMS"
