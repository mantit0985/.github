name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  readiness-gate:
    name: Readiness Gate
    runs-on: self-hosted
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set TAG variable
        id: set_tag
        run: echo "TAG=${{ github.ref#refs/tags/ }}" >> $GITHUB_ENV
      - name: Release actor gate
        uses: mantit0985/.github/.github/actions/release-actor-gate@main
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Verify tag name vs VERSION
        shell: bash
        run: |
          TAG=${{ env.TAG }}
          VERSION_CONTENT=$(git show HEAD:VERSION 2>/dev/null || echo "")
          VERSION=$(echo "$VERSION_CONTENT" | tr -d '[:space:]')
          TAG_NUM=${TAG#v}
          VER_NUM=${VERSION#v}
          if [ "$TAG_NUM" != "$VER_NUM" ]; then
            echo "FAIL[1]: Tag $TAG not equal to VERSION $VERSION" >&2
            exit 1
          fi
          echo "PASS[1] Tag matches VERSION"
      - name: Verify CI run succeeded
        shell: bash
        run: |
          TAG_COMMIT=$(git rev-parse HEAD)
          REPO=$(git remote get-url --push origin | sed -E -e 's|\.git/?$||' -e 's|.*github\.com[/:]([^/]+)/([^/]+)/?$|\1/\2|')
          API_URL="https://api.github.com/repos/${REPO}/actions/runs?head_sha=${TAG_COMMIT}"
          HTTP_CODE=$(curl -s -o "${RUNNER_TEMP}/ci_runs.json" -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${API_URL}")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "FAIL[3]: CI run lookup failed (HTTP ${HTTP_CODE}) for commit ${TAG_COMMIT}" >&2
            exit 1
          fi
          CI_CONCLUSION=$(jq -r '[.workflow_runs[] | select(.name | startswith("CI")) | .conclusion][0] // empty' "${RUNNER_TEMP}/ci_runs.json")
          if [ -z "$CI_CONCLUSION" ]; then
            echo "FAIL[3]: No CI run found for commit $TAG_COMMIT" >&2
            exit 1
          fi
          if [ "$CI_CONCLUSION" != "success" ]; then
            echo "FAIL[3]: CI run concluded $CI_CONCLUSION" >&2
            exit 1
          fi
          echo "PASS[3] Latest CI run succeeded"
      - name: Verify CD run terminal state
        shell: bash
        run: |
          TAG_COMMIT=$(git rev-parse HEAD)
          REPO=$(git remote get-url --push origin | sed -E -e 's|\.git/?$||' -e 's|.*github\.com[/:]([^/]+)/([^/]+)/?$|\1/\2|')
          API_URL="https://api.github.com/repos/${REPO}/actions/runs?head_sha=${TAG_COMMIT}"
          HTTP_CODE=$(curl -s -o "${RUNNER_TEMP}/cd_runs.json" -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${API_URL}")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "FAIL[4]: CD run lookup failed (HTTP ${HTTP_CODE}) for commit ${TAG_COMMIT}" >&2
            exit 1
          fi
          CD_CONCLUSION=$(jq -r '[.workflow_runs[] | select(.name | startswith("CD")) | .conclusion][0] // empty' "${RUNNER_TEMP}/cd_runs.json")
          if [ -z "$CD_CONCLUSION" ]; then
            echo "PASS[4] CD run not yet completed; waiting"
            exit 0
          fi
          if [ "$CD_CONCLUSION" != "success" ] && [ "$CD_CONCLUSION" != "skipped" ]; then
            echo "FAIL[4]: CD run concluded $CD_CONCLUSION" >&2
            exit 1
          fi
          echo "PASS[4] CD run succeeded or skipped"

  release:
    name: Publish Release
    needs: readiness-gate
    runs-on: self-hosted
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Release actor gate
        uses: mantit0985/.github/.github/actions/release-actor-gate@main
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Resolve repo slug
        shell: bash
        run: |
          REPO=$(git remote get-url --push origin | sed -E -e 's|\.git/?$||' -e 's|.*github\.com[/:]([^/]+)/([^/]+)/?$|\1/\2|')
          echo "REPO=$REPO" >> "$GITHUB_ENV"
      - name: Prepare artifacts
        shell: bash
        run: |
          TARGET_DIR=$(mktemp -d)
          echo "TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"
          tar -czf "${TARGET_DIR}/${GITHUB_REPOSITORY//\//-}-${{ env.TAG }}-source.tar.gz" --exclude=.git .
          (cd "${TARGET_DIR}" && find . -type f -print0 | sort -z | xargs -0 sha256sum --) > "$RUNNER_TEMP/SHA256SUMS"
          echo "Artifacts prepared in ${TARGET_DIR}"
      - name: Check for existing release
        shell: bash
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${REPO}/releases/tags/${{ env.TAG }}")
          if [ "$STATUS" = "200" ]; then
            echo "RELEASE_EXISTS: Release ${{ env.TAG }} already exists" >&2
            exit 1
          fi
      - name: Create release and upload assets
        shell: bash
        run: |
          TAG=${{ env.TAG }}
          BODY="$(awk -v t="## ${TAG}" '$0==t{f=1;next} f&&/^## /{exit} f' CHANGELOG.md || true)"
          if [ -z "$BODY" ]; then
            echo "NO_CHANGELOG_SECTION: CHANGELOG.md must contain a '## ${TAG}' section at the tagged commit" >&2
            exit 1
          fi
          RESP=$(curl -sf -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${REPO}/releases" -d "$(jq -n --arg tag "$TAG" --arg body "$BODY" '{tag_name:$tag, name:$tag, body:$body}')]"
          REL_ID=$(echo "$RESP" | jq -r '.id')
          if [ -z "$REL_ID" ] || [ "$REL_ID" = "null" ]; then echo "RELEASE_CREATE_FAILED: $(echo "$RESP" | head -c 400)" >&2; exit 1; fi
          cd "${TARGET_DIR}"
          upload_asset() {
            local FILE="$1" NAME
            NAME=$(basename "$FILE")
            ASSET_ID=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${REPO}/releases/${REL_ID}/assets" | jq -r --arg n "$NAME" '[.[] | select(.name==$n)][0].id // empty')
            if [ -n "$ASSET_ID" ]; then
              curl -sf -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${REPO}/assets/${ASSET_ID}"
            fi
            curl -sf -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/octet-stream' --data-binary "@${FILE}" "https://uploads.github.com/repos/${REPO}/releases/${REL_ID}/assets?name=${NAME}"
          }
          find . -type f | sed 's|^./||' | while read -r f; do upload_asset "${TARGET_DIR}/${f}"; done
          upload_asset "$RUNNER_TEMP/SHA256SUMS"
